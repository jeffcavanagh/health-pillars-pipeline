version: 2

sources:
  - name: raw
    database: HEALTH_PILLARS
    schema: RAW
    description: "Raw NHANES data loaded directly from source XPT files, before any transformation."
    tables:
      - name: DEMO_G
        description: "NHANES 2011-2012 demographics file. One row per respondent (SEQN) providing individual, family, and household variables."
        columns:
          - name: SEQN
            description: "Unique respondent sequence number. Primary key for this table and the join key across all NHANES files."
            tests:
              - unique
              - not_null
          - name: SDDSRVYR
            description: "Survey year of the participant."
            tests:
              - not_null
          - name: RIAGENDR
            description: "Gender of the participant."
            tests:
              - not_null
              - accepted_values:
                  arguments:
                    values: [1, 2]
          - name: RIDAGEYR
            description: "Respondents age in years at screening. Individuals 90 and over are topcoded at 80 years of age."
            tests:
              - not_null
          - name: RIDRETH3
            description: "Reported race and Hispanic origin information, with non-Hispanic Asian category"
            tests:
              - not_null
              - accepted_values:
                  arguments:
                    values: [1, 2, 3, 4, 5, 6, 7]
          - name: INDFMIN2
            description: "Annual family income in categorical dollar ranges. May be missing for respondents who declined to report or for whom no income estimate could be determined."
          - name: INDFMPIR
            description: "A ratio of family income to poverty."
          - name: DMDFMSIZ
            description: "Total number of people in the family."
            tests:
              - not_null
              - accepted_values:
                  arguments:
                    values: [1, 2, 3, 4, 5, 6, 7]

      - name: DR1TOT_G
        description: "NHANES 2011-2012 dietary interview total nutrient intake file for day 1."
        columns:
          - name: SEQN
            description: "Unique respondent sequence number. Primary key for this table and the join key across all NHANES files."
            tests:
              - unique
              - not_null

          - name: DR1DAY
            description: "Intake day of the week for the dietary interview."
            tests:
              - accepted_values:
                  arguments:
                    values: [1, 2, 3, 4, 5, 6, 7]
                  config:
                    where: "DR1DAY IS NOT NULL"

          - name: DR1TKCAL
            description: "Energy in kcal."
            tests:
              - value_between:
                  arguments:
                    min_value: 0
                    max_value: 20000
          
          - name: DR1TPROT
            description: "Protein intake in grams."
            tests:
              - value_between:
                  arguments:
                    min_value: 0
                    max_value: 500

          - name: DR1TCARB
            description: "Carbohydrate intake in grams."
            tests:
              - value_between:
                  arguments:
                    min_value: 0
                    max_value: 3000

          - name: DR1TSUGR
            description: "Sugar intake in grams."
            tests:
              - value_between:
                  arguments:
                    min_value: 0
                    max_value: 2000

          - name: DR1TFIBE
            description: "Dietary fiber intake in grams."
            tests:
              - value_between:
                  arguments:
                    min_value: 0
                    max_value: 200

          - name: DR1TTFAT
            description: "Total fat intake in grams."
            tests:
              - value_between:
                  arguments:
                    min_value: 0
                    max_value: 1000

          - name: DR1TSFAT
            description: "Total Saturated fat intake in grams."
            tests:
              - value_between:
                  arguments:
                    min_value: 0
                    max_value: 400
          
          - name: DR1TMFAT
            description: "Total Monounsaturated fat intake in grams."
            tests:
              - value_between:
                  arguments:
                    min_value: 0
                    max_value: 400

          - name: DR1TPFAT
            description: "Total Polyunsaturated fat intake in grams."
            tests:
              - value_between:
                  arguments:
                    min_value: 0
                    max_value: 300

          - name: DR1TP182
            description: "PFA 18:2 (octadecadienoic acid) intake in grams. Omega-6 fatty acid."
            tests:
              - value_between:
                  arguments:
                    min_value: 0
                    max_value: 200

          - name: DR1TP205
            description: "PFA 20:5 (eicosapentaenoic acid) intake in grams. Omega-3 fatty acid, EPA."
            tests:
              - value_between:
                  arguments:
                    min_value: 0
                    max_value: 3

          - name: DR1TP226
            description: "PFA 22:6 (docosahexaenoic acid) intake in grams. Omega-3 fatty acid, DHA."
            tests:
              - value_between:
                  arguments:
                    min_value: 0
                    max_value: 8

          - name: DR1TCHOL
            description: "Cholesterol intake in milligrams."
            tests:
              - value_between:
                  arguments:
                    min_value: 0
                    max_value: 3000
          
          - name: DR1TATOC
            description: "Vitamin E as alpha-tocopherol in milligrams."
            tests:
              - value_between:
                  arguments:
                    min_value: 0
                    max_value: 200
          
          - name: DR1TATOA
            description: "Added alpha-tocopherol (Vitamin E) in milligrams."
            tests:
              - value_between:
                  arguments:
                    min_value: 0
                    max_value: 100
          
          - name: DR1TRET
            description: "Retinol in micrograms (mcg)."
            tests:
              - value_between:
                  arguments:
                    min_value: 0
                    max_value: 40000

          - name: DR1TVARA
