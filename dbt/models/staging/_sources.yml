      - name: DS2TOT_G
        description: "NHANES 2011-2012 dietary supplement total nutrient intake file for day 2."
        columns:
          - name: SEQN
            description: "Unique respondent sequence number. Primary key for this table and the join key across all NHANES files."
            tests:
              - unique
              - not_null

          - name: DR2DRSTZ
            description: "Dietary recall status for day 2."
            tests:
              - not_null
          
          - name: DR2DAY
            description: "Intake day of week for day 2"
            tests:
              - accepted_values:
                  arguments:
                    values: [1, 2, 3, 4, 5, 6, 7]
                  config:
                    where: "DR2DAY IS NOT NULL"

          - name: DS2DSCNT
            description: "Total # of dietary supplements taken, day 2"
