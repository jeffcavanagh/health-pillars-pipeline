version: 2

models:
  - name: stg_nutrition
    description: "Cleaned, standardized, and averaged nutrient intake data, averaging across 2 days of dietary recall from both food and supplement sources, for participants in NHANES 2011-2012 survey."

    columns:
    - name: respondent_id
      description: "Unique identifier for each respondent in the NHANES 2011-2012 survey."
      tests:
        - unique
        - not_null

    - name: data_availability
      description: "Categorical indicator of available data from the two eligible days of dietary recall. Possible values are 'Both days', 'Day 1 only', 'Day 2 only', and 'No data'."
      tests:
        - not_null
        - accepted_values:
            arguments:
              values: [
                'Both days',
                'Day 1 only',
                'Day 2 only',
                'No data'
              ] 

    - name: tkcal_avg
      description: "Average total kilocalorie (kcal) intake across the two days of dietary recall."
      tests:
        - value_between:
            arguments:
              min_value: 0 
              max_value: 20000
    
    - name: tprot_avg
      description: "Average total protein (gm) intake across the two days of dietary recall."
      tests:
        - value_between:
            arguments:
              min_value: 0 
              max_value: 500

    - name: tcarb_avg
      description: "Average total carbohydrate (gm) intake across the two days of dietary recall."
      tests:
        - value_between:
            arguments:
              min_value: 0 
              max_value: 3000

    - name: tfat_avg
